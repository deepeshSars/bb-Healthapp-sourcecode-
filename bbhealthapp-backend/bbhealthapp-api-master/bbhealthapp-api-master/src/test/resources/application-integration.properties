# ===============================
# APP CONFIG
# ===============================
spring.application.name=master-service
server.port=8081

spring.profiles.active=integration

# ===============================
# SECURITY / JWT
# ===============================
token.secret=10d73c0906053a33e5b96500d7c5eeaf1674ed717f199a54c5baff4d7da9d0b0

server.error.include-message=always

# ===============================
# APP FLAGS
# ===============================
app.testrun=false

spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# H2 DATABASE CONFIG (MASTER SERVICE)
# ===============================
spring.h2.console.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable schema.sql - let Hibernate handle schema (Spring Boot 2.3.x property)
spring.datasource.initialization-mode=never

# ===============================
# MULTIPART CONFIG
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

## File Storage Properties
file.upload-dir=testuploads

MASTER_SVC_HOST=localhost
MASTER_SVC_PORT=8081

# ===============================
# MICROSERVICE COMMUNICATION
# ===============================
rootURL=http://${MASTER_SVC_HOST:localhost}:${MASTER_SVC_PORT:8081}

# ===============================
# LOGGING (OPTIONAL BUT USEFUL)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.binarybrains=DEBUG
